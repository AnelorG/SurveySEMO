# PARTIE 1 – Parcours de vie et réserve cognitive
# Types : nombre, texte_court, texte_libre, oui_non, choix_unique, choix_multiple, case_a_cocher,
#         section (titre), info (texte explicatif).
# si: {question: ID, egal: VALEUR}  -> affiche la question seulement si la réponse à ID vaut VALEUR
# si: {question: ID, rempli: true}  -> affiche la question seulement si ID a été renseignée
# Pas de bloc "scoring" : la règle de calcul de la réserve cognitive n'est pas définie dans le document.
id: parcours_vie
titre: Partie 1 – Parcours de vie et réserve cognitive
introduction: '*Les questions suivantes portent sur votre parcours scolaire, professionnel et vos activités au cours de la vie. Lorsque vous ne connaissez pas une réponse exacte, une estimation suffit.*


  *Appuyez sur Entrée après avoir tapé une réponse écrite : les questions qui en dépendent apparaissent alors.*'
questions:
- id: titre_0
  texte: Études et formation
  type: section
- id: r1_annees_etudes
  texte: R1. Combien d’années d’études avez-vous suivies au total ?
  type: nombre
  min: 0
  max: 40
- id: r2_diplome
  texte: R2. Quel est le diplôme le plus élevé que vous avez obtenu ?
  type: choix_unique
  options:
  - Aucun diplôme
  - Brevet / certificat d’études
  - CAP / BEP
  - Baccalauréat
  - Bac +2
  - Bac +3
  - Bac +5
  - Doctorat
  - Autre
- id: r2_autre
  texte: Précisez votre diplôme
  type: texte_court
  si:
    question: r2_diplome
    egal: Autre
- id: r3_formation
  texte: R3. Après vos études initiales, avez-vous suivi une ou plusieurs formations d’une durée d’au moins 6 mois ?
  type: oui_non
- id: r3_quoi
  texte: Quelle(s) formation(s) ?
  type: texte_court
  si:
    question: r3_formation
    egal: Oui
- id: r3_duree
  texte: Durée approximative
  type: texte_court
  si:
    question: r3_formation
    egal: Oui

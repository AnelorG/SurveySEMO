    question: mv19_tabac
    egal: Oui, mais j’ai arrêté
- id: mv19_cigarettes
  texte: Nombre moyen de cigarettes fumées par jour pendant la période de consommation
  type: choix_unique
  options:
  - Moins de 5
  - 5 à 10
  - 11 à 20
  - Plus de 20
  si: *id007
- id: mv20_alcool_freq
  texte: MV20. À quelle fréquence consommez-vous actuellement des boissons alcoolisées ?
  type: choix_unique
  options:
  - Jamais
  - Moins d’1 fois par semaine
  - 1 fois par semaine
  - 2 à 3 fois par semaine
  - 4 fois par semaine ou plus
- id: mv21_verres
  texte: MV21. Lors d’une journée où vous consommez de l’alcool, combien de verres standards buvez-vous habituellement ?
  type: choix_unique
  options:
  - 1 verre
  - 2 verres
  - 3 à 4 verres
  - 5 verres ou plus
  si:
    question: mv20_alcool_freq
    egal:
    - Moins d’1 fois par semaine
    - 1 fois par semaine
    - 2 à 3 fois par semaine
    - 4 fois par semaine ou plus
- id: mv22_alcool_passe
  texte: MV22. Au cours de votre vie adulte, avez-vous connu une période d’au moins 1 an pendant laquelle votre consommation d’alcool était plus importante qu’actuellement ?
  type: oui_non
- id: mv22_duree
  texte: Durée approximative de cette période (en années)
  type: nombre
  min: 0
  max: 80
  si: &id008
    question: mv22_alcool_passe
    egal: Oui
- id: mv22_conso
  texte: Consommation habituelle pendant cette période

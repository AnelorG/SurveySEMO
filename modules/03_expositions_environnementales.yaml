# MODULE 3 – EXPOSITIONS ENVIRONNEMENTALES ET PROFESSIONNELLES   (questionnaire RC-EA-EH, version du 27/10/2026)
# Fréquence : `scores:` = conversion en jours d'exposition par mois (0,5 ; 2 ; 8 ; 20 ; 30). Indices (durée en mois x jours/mois) : cotations.py.
# Les indices sont EXPLORATOIRES : ils ne représentent pas une dose réelle.
id: expositions_environnementales
titre: Module 3 – Expositions environnementales et professionnelles
introduction: '*Appuyez sur Entrée après avoir tapé une réponse écrite : les questions qui en dépendent apparaissent alors.*'
questions:
- id: titre_0
  texte: ENV1 – Expositions chimiques et professionnelles
  type: section
- id: info_1
  texte: "**ENV1. Au cours de votre vie, avez-vous été exposé(e), de manière régulière ou répétée, à l’une des substances ou situations suivantes, dans le cadre professionnel ou personnel ?**  \n*Pour chaque exposition, indiquez si vous avez été exposé(e), la durée approximative de cette exposition et sa fréquence habituelle.*"
  type: info
- id: env1_solvants
  type: choix_unique
  texte: '**Solvants, peintures, vernis, colles ou produits de nettoyage professionnels**'
  options: &id002
  - Non
  - Oui
  - Je ne sais pas
  horizontal: true
- id: env1_solvants_annees
  type: nombre
  min: 0
  max: 110
  texte: 'Durée approximative totale : années'
  si: &id001
    question: env1_solvants
    egal: Oui
- id: env1_solvants_mois
  type: nombre
  min: 0
  max: 11
  obligatoire: false
  texte: et mois
  si: *id001
- id: env1_solvants_freq
  type: choix_unique
  texte: Fréquence habituelle pendant cette période
  options: &id004
  - Moins d’une fois par mois
  - 1 à 3 jours par mois
  - 1 à 3 jours par semaine
  - 4 à 6 jours par semaine
  - Tous les jours ou presque
  scores: &id005
  - 0.5
  - 2
  - 8
  - 20
  - 30
  si: *id001

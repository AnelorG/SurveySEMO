# MODULE 5 – RÉSERVE COGNITIVE : Questionnaire sur les expériences de la vie (QEV / LEQ)   (document de validation du 12/11/2026)
# Version française QEV de C. Berr et D. Villebrun (INSERM U1061, 2011) ; référence : Valenzuela & Sachdev (2007) ; Ourry et al. (2021).
# Conditions : voir la liste en tête du module 1. Particularité : `question: _age` désigne l'âge du participant (les périodes « 30 à 65 ans » et
# « depuis 65 ans » ne sont posées qu'aux personnes concernées). Une condition peut aussi être une LISTE de conditions (toutes doivent être vraies).
# Cotation : voir cotations.py (sous-score général 0-35 par période). Les scores SPÉCIFIQUES et le score total LEQ ne sont pas calculés
# (barème de la version française 2011 « à confirmer » dans le document de validation).
id: reserve_cognitive
titre: Module 5 – Réserve cognitive (QEV / LEQ)
introduction: 'Ce questionnaire explore vos activités intellectuelles, sociales et de loisirs au fil de la vie (jeune adulte, vie adulte, puis à partir de 65 ans). Répondez aussi précisément que possible
  : une estimation suffit.


  *Appuyez sur Entrée après avoir tapé une réponse écrite : les questions qui en dépendent apparaissent alors.*'
questions:
- id: info_0
  texte: 'Répondez aussi précisément que possible. Cochez une réponse par question, sauf indication contraire. Durée indicative : environ 20 minutes. *Votre numéro, votre date de naissance et votre âge
    sont déjà connus de l’application : il n’est pas nécessaire de les ressaisir.*'
  type: info
- id: titre_1
  texte: Jeune adulte – De 13 à 30 ans
  type: section
- id: info_2
  texte: '**Questions spécifiques**'
  type: info

  - 3
  - 4
  - 5
  - 6
  horizontal: true
- id: ja_s2_secondaire
  type: choix_unique
  texte: JA-S2. Après vos études à l’école primaire, pendant combien d’années avez-vous étudié dans un établissement d’enseignement secondaire (collège, lycée, établissement technique…) ?

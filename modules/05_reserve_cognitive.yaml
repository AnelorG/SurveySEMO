  si: *id015
- id: ad_s1_60_65_categorie
  type: choix_unique
  texte: Catégorie professionnelle
  options: &id017
  - 1 – Directeurs, cadres de direction et gérants
  - 2 – Professions intellectuelles et scientifiques (sciences et techniques, informatique, santé, enseignement, justice, culture…)
  - 3 – Professions intermédiaires (techniciens, inspecteurs, infirmiers et paramédicaux, finance, services juridiques et sociaux…)
  - 4 – Employés de type administratif (bureau, secrétariat, accueil, comptabilité)
  - 5 – Services directs aux particuliers, commerçants et vendeurs (vendeurs, coiffeurs, serveurs, aides-soignants, sécurité…)
  - 6 – Agriculteurs et ouvriers qualifiés de l’agriculture, de la sylviculture et de la pêche
  - 7 – Métiers qualifiés de l’industrie et de l’artisanat (bâtiment, métallurgie, électricité, imprimerie, habillement…)
  - 8 – Conducteurs d’installations et de machines, ouvriers de l’assemblage (chauffeurs, conducteurs, mineurs, matelots)
  - 9 – Professions élémentaires (aides de ménage, agents d’entretien, manœuvres…)
  - 10 – Femmes au foyer
  - 11 – Retraités ou sans emploi
  - 12 – Professions militaires
  si: *id015

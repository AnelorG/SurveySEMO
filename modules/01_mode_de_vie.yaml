  - 0
  - 1
  - 2
  - 3
  horizontal: true
  si:
    question: mv12j_description
    rempli: true
- id: mv13_qualite
  type: choix_unique
  texte: MV13. Au cours du mois dernier, comment évalueriez-vous globalement la qualité de votre sommeil ?
  options:
  - Très bonne
  - Assez bonne
  - Assez mauvaise
  - Très mauvaise
  scores:
  - 0
  - 1
  - 2
  - 3
- id: mv14_medicaments
  type: choix_unique
  texte: MV14. Au cours du mois dernier, combien de fois avez-vous pris des médicaments (prescrits par un médecin ou délivrés sans ordonnance) pour faciliter votre sommeil ?
  options: *id005

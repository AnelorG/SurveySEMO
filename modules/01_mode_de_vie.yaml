- id: titre_21
  texte: Sommeil (PSQI)
  type: section
- id: mv8_coucher
  type: heure
  texte: MV8. Au cours du mois dernier, à quelle heure êtes-vous habituellement allé(e) vous coucher le soir (se mettre au lit) ? — Heure habituelle du coucher
- id: info_23
  texte: '**MV9. Au cours du mois dernier, combien de temps vous a-t-il fallu (en minutes) pour vous endormir le soir ?**'
  type: info
- id: mv9_latence
  texte: Nombre de minutes
  type: nombre
  min: 0
  max: 600
  pas: 1
- id: mv10_lever
  type: heure
  texte: MV10. Au cours du mois dernier, à quelle heure vous êtes-vous habituellement levé(e) le matin ? — Heure habituelle du lever
- id: info_26
  texte: "**MV11. Au cours du mois dernier, combien d’heures de sommeil effectif avez-vous eu chaque nuit ?**  \n*Ce nombre peut être différent du nombre d’heures que vous avez passées au lit.*"
  type: info
- id: mv11_sommeil_h
  texte: Heures de sommeil par nuit (ex. 6,5 pour 6 h 30)
  type: nombre
  min: 0
  max: 24
  pas: 0.25
- id: info_28
  texte: '*Pour chacune des questions suivantes, indiquez la meilleure réponse.*'
  type: info
- id: info_29
  texte: '**MV12. Au cours du mois dernier, avec quelle fréquence avez-vous eu des troubles du sommeil en lien avec les items suivants :**'
  type: info
- id: mv12a
  type: choix_unique
  texte: a. Vous n’avez pas pu vous endormir en moins de 30 mn
  options: &id005
  - Pas au cours du dernier mois
  - Moins d’une fois par semaine
  - Une ou deux fois par semaine
  - Trois ou quatre fois par semaine
  scores:
  - 0
  - 1
  - 2
  - 3
  horizontal: true
- id: mv12b
  type: choix_unique
  texte: b. Vous vous êtes réveillé(e) au milieu de la nuit ou précocement le matin
  options: *id005
  scores:
  - 0
  - 1
  - 2
  - 3
  horizontal: true
- id: mv12c

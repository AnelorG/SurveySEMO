  - Oui, dans la même chambre mais pas dans le même lit
  - Oui, dans le même lit
- id: titre_46
  texte: Alimentation (MEDAS)
  type: section
- id: mv18_huile_principale
  type: oui_non
  texte: MV18. Utilisez-vous l’huile d’olive comme principale source de matière grasse pour cuisiner ?
- id: info_48
  texte: "**MV19. Combien de cuillères à soupe d’huile d’olive utilisez-vous chaque jour ?**  \n*Incluez l’huile d’olive utilisée pour les salades, la préparation des repas, les repas consommés à l’extérieur, la friture, etc.*"
  type: info
- id: mv19_huile_cuilleres
  texte: Cuillères à soupe par jour
  type: nombre
  min: 0
  max: 30
  pas: 0.5
- id: info_50
  texte: "**MV20. Combien de portions de légumes consommez-vous par jour ?**  \n*Une portion correspond à environ ½ tasse de légumes crus ou cuits, ou 1 tasse de salade verte crue.*"
  type: info
- id: mv20_legumes
  texte: Portions par jour
  type: nombre
  min: 0
  max: 20
  pas: 0.5
- id: info_52
  texte: "**MV21. Combien de portions de fruits entiers consommez-vous par jour ?**  \n*Une portion correspond à environ ½ tasse de fruits ou un fruit entier de taille moyenne.*"
  type: info
- id: mv21_fruits
  texte: Portions par jour
  type: nombre
  min: 0
  max: 20
  pas: 0.5
- id: info_54
  texte: "**MV22. Combien de portions de viande rouge, de hamburger ou de saucisses consommez-vous par semaine ?**  \n*Une portion correspond à environ 100 à 150 g.*"
  type: info
- id: mv22_viande_rouge
  texte: Portions par semaine
  type: nombre
  min: 0
  max: 50
  pas: 0.5
- id: info_56
  texte: "**MV23. Combien de portions de beurre, de margarine ou de crème consommez-vous par jour ?**  \n*Une portion correspond à 1 cuillère à soupe. Ne pas inclure les margarines molles non hydrogénées.*"
  type: info
- id: mv23_beurre
  texte: Portions par jour
  type: nombre
  min: 0
  max: 20
  pas: 0.5
- id: info_58
  texte: "**MV24. Combien de boissons contenant des sucres ajoutés consommez-vous par jour ?**  \n*Une portion correspond à environ 355 mL, soit approximativement une canette. Cela comprend notamment les sodas sucrés, boissons aux fruits avec sucres ajoutés, boissons pour sportifs, boissons énergisantes et thés glacés sucrés.*"
  type: info
- id: mv24_boissons_sucrees
  texte: Portions par jour
  type: nombre
  min: 0
  max: 20
  pas: 0.5
- id: info_60
  texte: "**MV25. Consommez-vous du vin ? Si oui, quelle quantité consommez-vous par semaine ?**  \n*Un verre correspond à environ 100 mL.*"
  type: info
- id: mv25_vin
  texte: Verres par semaine (0 si aucun)
  type: nombre
  min: 0
  max: 100
  pas: 0.5
- id: info_62
  texte: "**MV26. Combien de portions de légumineuses consommez-vous par semaine ?**  \n*Exemples : haricots rouges, pois chiches, lentilles, haricots noirs, pois cassés. Une portion correspond à environ 150 g, soit environ ½ à ⅔ de tasse.*"
  type: info
- id: mv26_legumineuses
  texte: Portions par semaine
  type: nombre
  min: 0
  max: 50
  pas: 0.5
- id: info_64
  texte: "**MV27. Combien de portions de poisson ou de fruits de mer consommez-vous par semaine ?**  \n*Une portion de poisson correspond à environ 100 à 150 g. Une portion de fruits de mer correspond à environ 200 g ou 4 à 5 pièces, selon le type de fruits de mer.*"
  type: info
- id: mv27_poisson
  texte: Portions par semaine
  type: nombre
  min: 0
  max: 50
  pas: 0.5
- id: info_66
  texte: '**MV28. Combien de fois par semaine consommez-vous des produits de boulangerie ou de pâtisserie tels que des tartes, biscuits, gâteaux ou beignets ?**'
  type: info
- id: mv28_patisseries
  texte: Fois par semaine
  type: nombre
  min: 0
  max: 50
  pas: 0.5
- id: info_68
  texte: "**MV29. Combien de fois par semaine consommez-vous des fruits à coque ?**  \n*Exemples : noix, amandes, noisettes, noix de cajou, pistaches… Une portion correspond à environ 30 g.*"
  type: info
- id: mv29_fruits_coque
  texte: Fois par semaine
  type: nombre
  min: 0
  max: 50
  pas: 0.5
- id: mv30_volaille
  type: oui_non
  texte: MV30. Consommez-vous plus souvent du poulet ou de la dinde que du bœuf, du porc, des hamburgers ou des saucisses ?
- id: info_71
  texte: '**MV31. Combien de fois par semaine consommez-vous des plats préparés avec une sauce à base de tomate, d’ail, d’oignon ou de poireau revenus dans de l’huile d’olive ?**'
  type: info
- id: mv31_sofrito

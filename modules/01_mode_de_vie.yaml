# MODULE 1 – MODE DE VIE   (questionnaire RC-EA-EH, version du 27/10/2026)
# Cotations (IPAQ, PSQI, MEDAS, paquets-années, alcool) : voir cotations.py.
# Types : nombre, heure, texte_court, oui_non, choix_unique (avec `scores:` = codes PSQI), case_a_cocher, section, info.
# Conditions : si: {question: ID, egal: VALEUR | [VALEURS]}  /  {question: ID, rempli: true}  /  {question: ID, sup: 0}
id: mode_de_vie
titre: Module 1 – Mode de vie
introduction: '*Lorsque vous ne connaissez pas une réponse exacte, une estimation suffit. Appuyez sur Entrée après avoir tapé une réponse écrite : les questions qui en dépendent apparaissent alors.*'
questions:
- id: titre_0
  texte: Activité physique (IPAQ)
  type: section
- id: info_1
  texte: Les questions suivantes portent sur le temps que vous avez passé à être **actif physiquement** au cours des **7 derniers jours**.
  type: info
- id: mv1_jours_intense
  type: nombre
  min: 0
  max: 7
  texte: MV1. Au cours des 7 derniers jours, combien y a-t-il eu de jours au cours desquels vous avez fait des activités physiques intenses comme porter des charges lourdes, bêcher, faire du VTT ou jouer au football ? (jours par semaine ; indiquez 0 si aucun)
- id: info_3
  texte: '**MV2. Au total, combien de temps avez-vous passé à faire des activités intenses au cours des 7 derniers jours ?**'
  type: info
- id: mv2_intense_nsp
  texte: Je ne sais pas
  type: case_a_cocher
  obligatoire: false
  si:
    question: mv1_jours_intense
    sup: 0
- id: mv2_intense_heures
  texte: Heure(s) par jour
  type: nombre
  min: 0
  max: 24
  si: &id001
    question: mv2_intense_nsp
    egal: false
- id: mv2_intense_minutes
  texte: Minute(s) par jour
  type: nombre
  min: 0
  max: 59
  si: *id001
- id: mv3_jours_modere
  type: nombre
  min: 0
  max: 7
  texte: MV3. Au cours des 7 derniers jours, combien y a-t-il eu de jours au cours desquels vous avez fait des activités physiques modérées comme porter des charges légères, passer l’aspirateur, faire du vélo tranquillement, ou jouer à la pétanque ? Ne pas inclure la marche. (jours par semaine ; indiquez 0 si aucun)
- id: info_8
  texte: '**MV4. Au total, combien de temps avez-vous passé à faire des activités modérées au cours des 7 derniers jours ?**'
  type: info
- id: mv4_modere_nsp
  texte: Je ne sais pas
  type: case_a_cocher
  obligatoire: false
  si:
    question: mv3_jours_modere
    sup: 0

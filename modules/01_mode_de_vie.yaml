- id: mv4_modere_minutes
  texte: Minute(s) par jour
  type: nombre
  min: 0
  max: 59
  si: *id002
- id: mv5_jours_marche
  type: nombre
  min: 0
  max: 7
  texte: MV5. Au cours des 7 derniers jours, combien y a-t-il eu de jours au cours desquels vous avez marché pendant au moins 10 minutes d’affilée ? (jours par semaine ; indiquez 0 si aucun)
- id: info_13
  texte: '**MV6. Au total, combien de temps avez-vous passé à marcher au cours des 7 derniers jours ?**'
